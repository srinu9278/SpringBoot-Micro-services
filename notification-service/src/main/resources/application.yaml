server:
  port: 9006

spring:
  application:
    name: notification-service
  cloud:
    config:
      enabled: true
      fail-fast: true
  config:
    import: "configserver:http://localhost:8888"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: false
    hostname: ${spring.cloud.client.hostname:${spring.application.name}}
    instance-id: ${spring.cloud.client.hostname:${spring.application.name}}:${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.hotel.notification_service: DEBUG
    org.springframework.web: DEBUG
    org.springframework.cloud: DEBUG


# Notification Service Configuration
notification:
  service:
    retry:
      max-attempts: 3
      delay: 5000
    batch:
      size: 100
      timeout: 30000
    templates:
      enabled: true
      cache-ttl: 3600
    slack:
      enabled: true
      timeout: 10000
    email:
      enabled: true
      timeout: 10000
    sms:
      enabled: false
      timeout: 10000
    push:
      enabled: false
      timeout: 10000
    webhook:
      enabled: false
      timeout: 10000
    in-app:
      enabled: true
      timeout: 5000

