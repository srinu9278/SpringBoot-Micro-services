spring:
  cloud:
    config:
      enabled: true
      fail-fast: true
      uri: http://config-service:8888
  config:
    import: "configserver:http://config-service:8888"

eureka:
  client:
    service-url:
      defaultZone: http://service-discovery:8761/eureka/
  instance:
    prefer-ip-address: true
    hostname: notification-service

