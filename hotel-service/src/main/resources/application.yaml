spring:
  application:
    name: hotel-service
  profiles:
    active: local
  cloud:
    config:
      enabled: true
      fail-fast: true
  # config.import is set in application-docker.yml for Docker environment
  # For local development, uncomment: config:
  #   import: "configserver:http://localhost:8888"

server:
  port: 9002
  tomcat:
    max-parameter-count: 1000
    max-http-form-post-size: 50MB
    max-file-count: 10
    max-connections: 8192
    accept-count: 100

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: false
    hostname: ${spring.cloud.client.hostname:${spring.application.name}}
    instance-id: ${spring.cloud.client.hostname:${spring.application.name}}:${spring.application.name}:${server.port}

# Logging configuration
logging:
  level:
    com.hotel.hotel_service: INFO
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Feign Client Configuration
feign:
  client:
    config:
      default:
        connect-timeout: 5000
        read-timeout: 10000
        logger-level: full
  hystrix:
    enabled: true

# Hystrix Configuration
hystrix:
  command:
    default:
      execution:
        timeout:
          enabled: true
        isolation:
          thread:
            timeout-in-milliseconds: 10000

# Custom application properties
app:
  upload:
    dir: uploads/hotels
