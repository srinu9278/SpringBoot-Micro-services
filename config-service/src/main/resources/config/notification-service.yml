server:
  port: 9006

spring:
  application:
    name: notification-service
  data:
    mongodb:
      uri: mongodb://localhost:27017
      database: hotel_notifications
      auto-index-creation: true
      write-concern: acknowledged
      read-preference: primary
      max-connections-per-host: 100
      min-connections-per-host: 5
      max-connection-idle-time: 30000
      max-connection-life-time: 600000
      server-selection-timeout: 30000
      connect-timeout: 10000
      socket-timeout: 0
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: false
    hostname: ${spring.cloud.client.hostname:${spring.application.name}}
    instance-id: ${spring.cloud.client.hostname:${spring.application.name}}:${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.hotel.notification_service: DEBUG
    org.springframework.web: DEBUG
    org.springframework.cloud: DEBUG
    org.springframework.amqp: DEBUG

# Slack Configuration - Use environment variables only
slack:
  bot:
    token: ${SLACK_BOT_TOKEN}
  default:
    channel: ${SLACK_DEFAULT_CHANNEL:#hotel-general}
  channels:
    bookings: ${SLACK_BOOKINGS_CHANNEL:#hotel-bookings}
    payments: ${SLACK_PAYMENTS_CHANNEL:#hotel-payments}
    rooms: ${SLACK_ROOMS_CHANNEL:#hotel-rooms}
    guests: ${SLACK_GUESTS_CHANNEL:#hotel-guests}
    maintenance: ${SLACK_MAINTENANCE_CHANNEL:#hotel-maintenance}
    alerts: ${SLACK_ALERTS_CHANNEL:#hotel-alerts}
    general: ${SLACK_GENERAL_CHANNEL:#hotel-general}

# Notification Service Configuration
notification:
  service:
    retry:
      max-attempts: 3
      delay: 5000
    batch:
      size: 100
      timeout: 30000
    templates:
      enabled: true
      cache-ttl: 3600
    slack:
      enabled: true
      timeout: 10000
    email:
      enabled: true
      timeout: 10000
    sms:
      enabled: false
      timeout: 10000
    push:
      enabled: false
      timeout: 10000
    webhook:
      enabled: false
      timeout: 10000
    in-app:
      enabled: true
      timeout: 5000
