server:
  port: 9004

spring:
  application:
    name: booking-service
  datasource:
    url: jdbc:postgresql://localhost:5432/hotels
    username: postgres
    password: Srinu@9278
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      auto-commit: false
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    jdbc:
      batch_size: 20
    order_inserts: true
    order_updates: true
    batch_versioned_data: true
    cache:
      use_second_level_cache: false
    show_sql: false
    format_sql: true
    use_sql_comments: true
    generate_statistics: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: false
    hostname: ${spring.cloud.client.hostname:${spring.application.name}}
    instance-id: ${spring.cloud.client.hostname:${spring.application.name}}:${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
      show-components: always
    info:
      enabled: true
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
    build:
      enabled: true
    git:
      enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/booking-service.log
    max-size: 10MB
    max-history: 30
  level:
    root: INFO
    com.hotel.booking_service: DEBUG
    org.springframework.web: DEBUG
    org.springframework.data.jpa: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.transaction: DEBUG
    org.springframework.orm.jpa: DEBUG
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web.reactive: DEBUG
    reactor.netty: DEBUG
    reactor.netty.http.server: DEBUG
    server.netty.accesslog: DEBUG

# Booking Service specific configurations
booking:
  service:
    # Booking reference generation
    reference:
      prefix: "BK"
      length: 8
    
    # Booking lifecycle settings
    lifecycle:
      confirmation:
        timeout-hours: 24
      reminder:
        before-checkin-hours: 24
        before-checkout-hours: 2
    
    # Payment settings
    payment:
      timeout-minutes: 30
      retry-attempts: 3
    
    # Notification settings
    notification:
      email:
        enabled: true
        from: "noreply@hotelmanagement.com"
      sms:
        enabled: false
    
    # Booking limits
    limits:
      max-guests-per-room: 10
      max-rooms-per-booking: 5
      max-advance-booking-days: 365
      min-advance-booking-hours: 2
    
    # Cancellation policy
    cancellation:
      free-cancellation-hours: 24
      partial-refund-hours: 12
      no-refund-hours: 4


