server:
  port: 9003

spring:
  application:
    name: room-service
  datasource:
    url: jdbc:postgresql://localhost:5432/hotels
    username: postgres
    password: Srinu@9278
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      auto-commit: false
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
        batch_versioned_data: true
        cache:
          use_second_level_cache: false
        show_sql: false
        use_sql_comments: true
        generate_statistics: false
        connection:
          provider_disables_autocommit: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC
  transaction:
    rollback-on-commit-failure: true
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: false
    hostname: ${spring.cloud.client.hostname:${spring.application.name}}
    instance-id: ${spring.cloud.client.hostname:${spring.application.name}}:${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
      show-components: always
    info:
      enabled: true
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
    build:
      enabled: true
    git:
      enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/room-service.log
    max-size: 10MB
    max-history: 30
  level:
    root: INFO
    com.hotel.room_service: DEBUG
    org.springframework.web: DEBUG
    org.springframework.data.jpa: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.transaction: DEBUG
    org.springframework.orm.jpa: DEBUG

# Room Service specific configurations
room:
  service:
    # Room management settings
    management:
      max-rooms-per-hotel: 1000
      max-occupancy-per-room: 10
      default-room-status: "AVAILABLE"
    
    # Room types configuration
    types:
      enabled:
        - "SINGLE"
        - "DOUBLE"
        - "TWIN"
        - "TRIPLE"
        - "QUAD"
        - "SUITE"
        - "DELUXE"
        - "PRESIDENTIAL"
        - "FAMILY"
        - "STUDIO"
    
    # Room status configuration
    status:
      available: "AVAILABLE"
      occupied: "OCCUPIED"
      out-of-order: "OUT_OF_ORDER"
      maintenance: "MAINTENANCE"
      cleaning: "CLEANING"
      reserved: "RESERVED"
    
    # Room amenities
    amenities:
      default:
        - "WiFi"
        - "Air Conditioning"
        - "TV"
        - "Mini Bar"
        - "Safe"
      premium:
        - "WiFi"
        - "Air Conditioning"
        - "TV"
        - "Mini Bar"
        - "Safe"
        - "Balcony"
        - "Sea View"
        - "Jacuzzi"
        - "Room Service"
    
    # Pricing configuration
    pricing:
      currency: "USD"
      tax-rate: 0.10
      service-charge-rate: 0.05
      discount-threshold: 7  # days for long stay discount
      long-stay-discount: 0.15


