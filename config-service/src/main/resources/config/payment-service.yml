spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://localhost:5432/hotels
    username: postgres
    password: Srinu@9278
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      auto-commit: false
  jpa:
    hibernate:
      ddl-auto: update
      dialect: org.hibernate.dialect.PostgreSQLDialect
      format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    generate-ddl: true
    properties:
      hibernate:
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
        batch_versioned_data: true
        cache:
          use_second_level_cache: false
        show_sql: false
        format_sql: true
        use_sql_comments: true
        generate_statistics: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

server:
  port: 9005

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: false
    hostname: ${spring.cloud.client.hostname:${spring.application.name}}
    instance-id: ${spring.cloud.client.hostname:${spring.application.name}}:${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
      show-components: always
    info:
      enabled: true
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
    build:
      enabled: true
    git:
      enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/payment-service.log
    max-size: 10MB
    max-history: 30
  level:
    root: INFO
    com.hotel.payment_service: DEBUG
    org.springframework.web: DEBUG
    org.springframework.data.jpa: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.transaction: DEBUG
    org.springframework.orm.jpa: DEBUG

# Payment Service specific configurations
payment:
  service:
    # Payment processing settings
    processing:
      timeout: 30000  # 30 seconds
      retry-attempts: 3
      retry-delay: 5000  # 5 seconds
      
    # Payment gateway settings
    gateway:
      default: "STRIPE"
      supported-gateways:
        - "STRIPE"
        - "RAZORPAY"
        - "PAYPAL"
      
    # Payment expiry settings
    expiry:
      default-hours: 24
      max-hours: 168  # 7 days
      
    # Refund settings
    refund:
      max-refund-days: 30
      partial-refund-allowed: true
      auto-refund-threshold: 100.00  # Auto refund for amounts below this
      
    # Security settings
    security:
      encrypt-sensitive-data: true
      mask-card-details: true
      log-payment-details: false
      
    # Notification settings
    notifications:
      send-payment-confirmation: true
      send-refund-notification: true
      send-failure-notification: true
      
    # Currency settings
    currency:
      default: "USD"
      supported:
        - "USD"
        - "EUR"
        - "GBP"
        - "INR"
        - "CAD"
        - "AUD"
        
    # Fee settings
    fees:
      processing-fee-rate: 0.029  # 2.9%
      fixed-fee: 0.30
      refund-fee-rate: 0.0  # No refund fee
      
    # Limits
    limits:
      max-payment-amount: 100000.00
      min-payment-amount: 0.50
      max-daily-payments: 1000
      max-daily-amount: 1000000.00
