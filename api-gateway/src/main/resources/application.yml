spring:
  application:
    name: api-gateway
  # profiles.active is set via SPRING_PROFILES_ACTIVE environment variable in Docker
  # For local development, set: profiles:
  #   active: local
  cloud:
    config:
      enabled: true
      fail-fast: true
  # config.import is set in application-docker.yml for Docker environment
  # For local development, use: config:
  #   import: "configserver:http://localhost:8888"
    gateway:
      routes:
        # User Service Routes
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/v2/user/**
          filters:
            - StripPrefix=0
        # Hotel Service Routes
        - id: hotel-service
          uri: lb://hotel-service
          predicates:
            - Path=/api/v2/hotel/**
          filters:
            - StripPrefix=0
        # Room Service Routes (for future)
        - id: room-service
          uri: lb://room-service
          predicates:
            - Path=/api/v2/room/**
          filters:
            - StripPrefix=0
        # Booking Service Routes
        - id: booking-service
          uri: lb://booking-service
          predicates:
            - Path=/api/v2/booking/**
          filters:
            - StripPrefix=0
        # Payment Service Routes
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/v2/payment/**
          filters:
            - StripPrefix=0
        # Notification Service Routes (for future)
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/v2/notification/**
          filters:
            - StripPrefix=0
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
